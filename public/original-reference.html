<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IntegraIQ – Intelligent Integration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--card:#fff;--tx:#161a2b;--mu:#5f6577;--bd:#e0e8e5;--ac:#0b8a5f;--ac2:#14b88a;--ok:#16794c;--okb:#e3f6ec;--wn:#8a5200;--wnb:#fff3dc;--er:#c0262d;--erb:#fde8e8;--in:#1d4ed8;--inb:#e6eefc;--cd:#08162b;--cdt:#d7dcff;--navy:#0b1f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1628;--card:#10243f;--tx:#e8eaff;--mu:#9fb0cc;--bd:#1f3a5c;--ac:#34d399;--ac2:#2dd4bf;--ok:#5fd9a0;--okb:#0f3a2c;--wn:#ffc15e;--wnb:#33280f;--er:#f87171;--erb:#3a1418;--in:#93b4ff;--inb:#132a52}:root:not([data-theme="light"]) .btn:not(.ghost){color:#04261b}}
:root[data-theme="dark"]{--bg:#0a1628;--card:#10243f;--tx:#e8eaff;--mu:#9fb0cc;--bd:#1f3a5c;--ac:#34d399;--ac2:#2dd4bf;--ok:#5fd9a0;--okb:#0f3a2c;--wn:#ffc15e;--wnb:#33280f;--er:#f87171;--erb:#3a1418;--in:#93b4ff;--inb:#132a52}
:root[data-theme="dark"] .btn:not(.ghost){color:#04261b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{display:flex;align-items:stretch;min-height:100vh}

/* sidebar */
aside{width:250px;flex:none;background:var(--navy);color:#cfd9ea}
.side-in{position:sticky;top:env(safe-area-inset-top,0px);padding:22px 14px}
.logo{font-weight:700;display:flex;gap:10px;align-items:center;padding:0 8px 20px;font-size:15px;line-height:1.25;color:#fff}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0b8a5f,#14b88a);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{display:flex;align-items:center;gap:14px;text-align:left;border:0;background:none;color:#9fb0cc;padding:12px 16px;border-radius:12px;font:inherit;font-size:15px;cursor:pointer;font-weight:500;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.07)}
nav button .ic{width:20px;text-align:center;font-size:17px}
nav button.on{background:rgba(52,211,153,.14);color:#34d399;box-shadow:inset 3px 0 0 #34d399}
.side-git{margin:20px 8px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.g-t{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12.5px;font-weight:700;margin-bottom:8px}
.g-ok{font-style:normal;font-size:10.5px;font-weight:700;color:#ffc15e;background:rgba(255,193,94,.15);padding:2px 8px;border-radius:99px}
.side-git input{width:100%;margin-bottom:6px;padding:7px 9px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px}
.g-err{color:#fca5a5;font-size:11.5px;min-height:0}
.g-open{display:inline-block;color:#34d399;font-size:12.5px;font-weight:600;text-decoration:none;margin-top:2px}.g-open:hover{text-decoration:underline}
.g-f{display:flex;align-items:center;gap:6px;width:calc(100% + 8px);padding:6px 8px;margin:0 -4px;border:0;background:none;border-radius:8px;color:#cfd9ea;font:inherit;font-size:11.5px;cursor:pointer;text-align:left}.g-f:hover{background:rgba(255,255,255,.08)}
.g-f span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g-f code{color:#34d399;font-size:11px}
.g-e{color:#9fb0cc;font-size:12px;line-height:1.45}
.side-foot{margin:22px 8px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);color:#9fb0cc;font-size:12.5px;line-height:1.45}
.side-foot b{color:#fff;display:block;margin-bottom:2px;font-size:13px}
.sf-btns{display:grid;gap:6px;margin-top:10px}
.sf-b{font:inherit;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;text-align:left}.sf-b:hover{background:rgba(255,255,255,.12)}

/* layout */
main{flex:1;min-width:0;max-width:1120px;margin:0 auto;padding:28px 28px 60px}
body.touring main{padding-bottom:220px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em;font-weight:750}h2{font-size:17px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
p.sub{color:var(--mu);margin:0 0 20px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.banner{background:var(--wnb);color:var(--wn);border:1px solid color-mix(in srgb,var(--wn) 30%,transparent);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:20px}
.banner .lnk{color:inherit;text-decoration:underline}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,60,.04),0 4px 14px rgba(20,24,60,.04)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.note{padding:12px 16px;border-radius:10px;background:var(--inb);color:var(--in);margin-bottom:16px;font-size:14px}
.note.warn{background:var(--erb);color:var(--er)}.note .lnk{color:inherit;text-decoration:underline}
.small{font-size:13px}.mt{margin-top:12px}.mu{color:var(--mu)}.hide{display:none}

/* forms */
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.row>.w-sm{flex:0 0 110px;min-width:90px}
.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;flex:none;width:auto;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 35%,transparent)}.btn:active{transform:none}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}.btn.sm{padding:6px 10px;font-size:13px}
.lnk{font:inherit;border:0;background:none;color:var(--ac);padding:0;font-weight:600;cursor:pointer}
.err{color:var(--er);margin-top:8px;font-size:14px}.err ul{margin:6px 0 0;padding-left:18px}
.serr{color:var(--er);font-size:12.5px;font-weight:600;margin:6px 0 0}
.opline{display:grid;grid-template-columns:100px 1fr 1.2fr 1fr auto;gap:8px;margin-top:8px}
@media(max-width:640px){.opline{grid-template-columns:1fr 1fr}}

/* tags */
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.ok,.st-active{background:var(--okb);color:var(--ok)}.wn{background:var(--wnb);color:var(--wn)}.info,.st-beta{background:var(--inb);color:var(--in)}.st-deprecated{background:var(--erb);color:var(--er)}
.ver{font:600 12px ui-monospace,Menlo,monospace;color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;vertical-align:middle}
.pill{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-weight:700;font-size:13px;padding:5px 12px;border-radius:99px;white-space:nowrap}
.m{font:600 11px ui-monospace,Menlo,monospace;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,currentColor 14%,transparent);min-width:54px;display:inline-block;text-align:center}
.GET{color:#0a7d4a}.POST{color:#b45309}.PUT{color:#1d4ed8}.DELETE{color:#c0262d}.PATCH{color:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .GET{color:#34d399}:root:not([data-theme="light"]) .POST{color:#fbbf24}:root:not([data-theme="light"]) .PUT{color:#60a5fa}:root:not([data-theme="light"]) .DELETE{color:#f87171}:root:not([data-theme="light"]) .PATCH{color:#c4b5fd}}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
pre{background:var(--cd);color:var(--cdt);border:1px solid #1b3355;padding:14px;border-radius:10px;overflow-x:auto;font-size:12.5px;margin:10px 0 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px;border-top:1px solid var(--bd);font-size:14px;vertical-align:top}
th{white-space:nowrap}
.ops{margin:8px 0 0;padding:0;list-style:none}.ops li{padding:6px 0;border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* home */
.quote{background:radial-gradient(600px 220px at 85% 0,rgba(52,211,153,.3),transparent 60%),radial-gradient(420px 200px at 0 100%,rgba(37,99,235,.38),transparent 60%),linear-gradient(135deg,#0b1f3a,#12385e);color:#fff;border-radius:14px;padding:30px 32px;margin-bottom:18px;position:relative;overflow:hidden;border-left:4px solid #34d399}
.quote:after{content:"”";position:absolute;right:22px;top:-30px;font:120px Georgia,serif;color:rgba(52,211,153,.2)}
.q-t{font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.3;max-width:720px}.q-s{color:#9fb0cc;font-size:13.5px;margin-top:8px;max-width:620px}
.met-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.met{padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}
.met b{display:block;font-size:26px;line-height:1.15}.met span{font-size:12.5px;color:var(--mu)}
.met.hl{background:var(--okb);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.met.hl b{color:var(--ok)}
.met-n{font-size:13px;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.met-n label{margin:0;font-size:13px}.met-n input{width:80px;padding:5px 8px}
.wf-h2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.wf-h2 h2{margin:0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-bottom:16px;align-items:start}
.wf{padding:0;border-top:3px solid var(--ac);margin:0}
.wf-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}.wf-h h2{margin:0;font-size:16px}
.wf-r{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:9px 18px;border-top:1px solid var(--bd);font-size:13.5px}.wf-r b{color:var(--ac)}.wf-r span{color:var(--mu)}
.wf-n{margin:0;padding:10px 18px 14px;font-size:13px;border-top:1px solid var(--bd)}
.u-s{padding:12px 18px;border-top:1px solid var(--bd)}.u-t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}.chip:hover{border-color:var(--ac);color:var(--ac)}
.ur{display:flex;justify-content:space-between;gap:10px;width:100%;padding:6px 0;border:0;background:none;color:inherit;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}.ur:hover span{color:var(--ac)}.ur b{color:var(--ac)}
.home-cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.home-cards .card{padding:22px;margin:0;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--ac);transition:transform .18s,box-shadow .18s}
.home-cards .card:nth-child(2){border-top-color:var(--ac2)}.home-cards .card:nth-child(3){border-top-color:#2563eb}.home-cards .card:nth-child(4){border-top-color:#7c3aed}
.home-cards .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,31,58,.14)}
.home-cards .card h2{font-size:18px;margin:0 0 4px}.home-cards .card p{font-size:15px;line-height:1.6;flex:1;margin:0 0 14px}
.home-cards .card .btn{align-self:flex-start}
.hc-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--ac) 12%,transparent);margin-bottom:8px}

/* discovery */
.searchbox{padding:22px 24px;border-top:3px solid var(--ac)}.searchbox label{margin-top:0}.searchbox .row{flex-wrap:nowrap}.searchbox input{padding:13px 15px;font-size:15px;border-radius:10px}.searchbox .btn{padding:0 28px}
.try{font-size:13px;margin:10px 0 0;color:var(--mu)}.try .lnk{font-weight:500}
.scan{padding:22px 24px}.sc-h{display:flex;align-items:center;gap:12px;font-size:16px;margin-bottom:12px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--ac);animation:spin .7s linear infinite}
.sc-s{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--mu);font-size:14px;opacity:.55;transition:.2s}.sc-s i{width:16px;height:16px;border-radius:50%;border:2px solid var(--bd)}
.sc-s.on{opacity:1;color:var(--tx)}.sc-s.on i{border-color:var(--ac);border-top-color:transparent;animation:spin .6s linear infinite}.sc-s.done{opacity:1;color:var(--ok)}.sc-s.done i{background:var(--ok);border-color:var(--ok)}
.res-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.found{padding:0;overflow:hidden;border-top:3px solid var(--ac)}
.f-top{display:flex;gap:16px;align-items:center;padding:20px 24px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 10%,transparent),transparent)}
.f-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:24px;color:#fff;flex:none}
.f-ti{flex:1;min-width:0}.f-ti h2{font-size:21px;margin:8px 0 2px;letter-spacing:-.015em}.f-ti p{margin:0;color:var(--mu)}
.f-cnt{text-align:center;padding:10px 18px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}.f-cnt b{display:block;font-size:28px;line-height:1.1;color:var(--ac)}.f-cnt span{font-size:12px;color:var(--mu)}
.f-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--bd);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.f-meta div{background:var(--card);padding:12px 24px;min-width:0;font-size:14px}.f-meta i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:3px}.f-meta code{word-break:break-all}
.f-meta a{color:var(--ac)}
.f-rec{margin:18px 24px 0;padding:14px 16px;border-radius:12px;background:var(--okb);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.f-rec-t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ok);font-size:14px}.f-rec-t span{font-weight:600}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ok) 20%,transparent);margin:10px 0}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--ac2));animation:grow .9s ease both}
.f-rec p{margin:0;font-size:14px}
.f-rec.rv{background:var(--inb);border-color:color-mix(in srgb,var(--in) 30%,transparent)}.f-rec.rv .f-rec-t{color:var(--in)}.f-rec.rv .bar{background:color-mix(in srgb,var(--in) 18%,transparent)}.f-rec.rv .bar i{background:var(--in)}
.f-rec.warn{background:var(--wnb);border-color:color-mix(in srgb,var(--wn) 35%,transparent)}.f-rec.warn .f-rec-t{color:var(--wn)}.f-rec.warn .bar{background:color-mix(in srgb,var(--wn) 20%,transparent)}.f-rec.warn .bar i{background:var(--wn)}
.f-h{padding:18px 24px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.f-ops{padding:0 24px;display:grid;gap:8px}
.f-op{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}.f-op code{font-weight:600}
.f-act{display:flex;gap:12px;flex-wrap:wrap;padding:20px 24px 24px}.f-act .btn{padding:12px 22px}
.rpanel{margin:0 24px 24px;padding:18px;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--ac) 5%,transparent)}
.card:not(.found)>.rpanel{margin:16px 0 0}
.rpanel p{margin:6px 0}
.none-fit{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.none-fit p{margin:4px 0 0}

/* creation */
.stp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}.stp em{width:24px;height:2px;background:var(--bd)}
.sp{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--mu);transition:.2s}
.sp i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bd);font-size:12px}
.sp.done{color:var(--ok);border-color:var(--ok);background:var(--okb)}.sp.done i{background:var(--ok);color:#fff}
.cg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.cg-r{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}.live pre{max-height:70vh;overflow:auto;margin-top:0}
.dupbox{margin-top:10px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--bg)}.dupbox>b{font-size:13px}
.dupr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:8px 0;border:0;border-top:1px solid var(--bd);background:none;color:inherit;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.dupr:hover .dn{color:var(--ac)}.dupr b{color:var(--ac)}.dupr .dw{grid-column:1/-1;font-size:12.5px}.dupr em{color:var(--mu)}

/* docs */
.dsearch{margin-bottom:12px;padding:11px 14px;border-radius:10px}
.pick{margin:0;padding:12px;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.pick.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
#picks{margin-bottom:16px}

/* architecture */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.fs{flex:1 1 130px;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.fs span{font-size:20px}.fs small{color:var(--mu);font-size:12.5px;line-height:1.35}
.fa{align-self:center;color:var(--ac);font-weight:700}
.cmp td:first-child{font-weight:600;white-space:nowrap}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card ul.lst{margin:0;padding-left:18px}.card ul.lst li{margin:6px 0}

/* tour + toast */
.tour{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:350px;max-width:calc(100% - 32px);background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.22);z-index:40}
.t-n{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ac)}.tour p{margin:6px 0 12px;font-size:14.5px}.t-b{display:flex;justify-content:flex-end;gap:8px}

<body>
<div class="shell">
<aside id="side"><div class="side-in">
  <div class="logo"><i aria-hidden="true">⚡</i><span>Integration API<br>Accelerator</span></div>
  <div class="role" id="role"></div>

  <div class="banner" role="note"><b>Demo mode.</b> The catalog is sample data, Git commits and pull requests are simulated, and matching is rule-based. <button class="lnk" onclick="go('arch')">See the production design →</button></div>
  <div id="app"></div>
</main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// ================= Helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const sha=()=>Array.from({length:7},()=>'0123456789abcdef'[Math.random()*16|0]).join('');
const safeUrl=u=>{u=String(u||'').trim();return /^https:\/\/[^\s"'<>]+$/i.test(u)?u:''};
const isHttpUrl=u=>{try{const x=new URL(String(u).trim());return /^https?:$/.test(x.protocol)&&!!x.host}catch(e){return false}};
const looksUrl=q=>/^https?:\/\//i.test(q)||/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|:|$)/i.test(q);
function parseUrl(u){try{u=String(u).trim();const x=new URL(/^https?:\/\//i.test(u)?u:'https://'+u);return{host:x.host.toLowerCase(),path:x.pathname.replace(/\/+$/,'').toLowerCase()}}catch(e){return null}}
function normSfx(s){s=String(s||'').trim().toLowerCase().replace(/\/+$/,'');return s&&s[0]!=='/'?'/'+s:s}
const g=id=>((document.getElementById(id)||{}).value||'').trim();
const METHODS=['GET','POST','PUT','PATCH','DELETE'];
const authLbl=a=>a.auth==='oauth'?'OAuth 2.0 (bearer JWT)':'Subscription key';
const ST={active:'Active',beta:'Beta',deprecated:'Deprecated'};
const stBadge=a=>`<span class="tag st-${esc(a.status)}">${ST[a.status]||esc(a.status)}</span>`;
const idxByName=n=>store.apis.findIndex(a=>a.name===n);
const idxById=id=>store.apis.findIndex(a=>a.id===id);
const specPath=a=>`apis/${slug(a.name)||'untitled'}/${a.version||'v1'}/openapi.yaml`;

// ================= Seed catalog (sample data) =================
const SVC='https://github.com/contoso-ai/';
const SEED=[
 {name:'Model Inference API',backend:'https://ml.internal.contoso.com/inference',suffix:'/ai/inference/v1',codeRepo:SVC+'model-inference-api',vault:'kv-ai-prod/ml-inference-key',team:'ML Platform',contact:'ml-platform@contoso.com',status:'active',auth:'oauth',consumers:14,desc:'Run predictions against hosted ML and LLM models.',ops:[['POST','/predict','Run a model prediction'],['POST','/chat/completions','LLM chat completion'],['GET','/models','List available models'],['GET','/models/{id}','Get model details'],['GET','/health','Service health']]},
 {name:'Embeddings API',backend:'https://ai.contoso.com/embeddings',suffix:'/ai/embeddings/v1',codeRepo:SVC+'embeddings-api',vault:'kv-ai-prod/embeddings-key',team:'AI Search',contact:'ai-search@contoso.com',status:'active',auth:'key',consumers:9,desc:'Generate vector embeddings for text and documents.',ops:[['POST','/embed','Embed a single text'],['POST','/embed/batch','Embed a batch of texts'],['GET','/dimensions','Get vector dimensions']]},
 {name:'Vector Search API',backend:'https://vector.contoso.com/search',suffix:'/ai/search/v1',codeRepo:SVC+'vector-search-api',vault:'kv-ai-prod/vector-search-key',team:'AI Search',contact:'ai-search@contoso.com',status:'active',auth:'oauth',consumers:7,desc:'Similarity search across indexed knowledge bases.',ops:[['POST','/query','Semantic similarity search'],['POST','/index','Add documents to index'],['DELETE','/index/{id}','Remove a document'],['GET','/indexes','List indexes']]},
 {name:'Document Summarizer API',backend:'https://nlp.contoso.com/summarize',suffix:'/ai/summarize/v1',codeRepo:SVC+'doc-summarizer-api',vault:'kv-ai-prod/nlp-key',team:'NLP Services',contact:'nlp-services@contoso.com',status:'active',auth:'key',consumers:5,desc:'Summarize long documents with an LLM.',ops:[['POST','/summarize','Summarize text'],['POST','/summarize/file','Summarize an uploaded file'],['GET','/jobs/{id}','Get async job status']]},
 {name:'Prompt Management API',backend:'https://prompts.contoso.com/v1',suffix:'/ai/prompts/v1',codeRepo:SVC+'prompt-mgmt-api',vault:'kv-ai-prod/prompt-store-key',team:'GenAI Enablement',contact:'genai@contoso.com',status:'beta',auth:'key',consumers:3,desc:'Store, version and retrieve prompt templates.',ops:[['GET','/prompts','List prompts'],['POST','/prompts','Create a prompt'],['PUT','/prompts/{id}','Update a prompt'],['DELETE','/prompts/{id}','Delete a prompt']]},
 {name:'Legacy Text Analytics API',backend:'https://nlp.contoso.com/legacy-text',suffix:'/nlp/text/v1',codeRepo:SVC+'legacy-text-analytics',vault:'kv-ai-prod/nlp-key',team:'NLP Services',contact:'nlp-services@contoso.com',status:'deprecated',successor:'Document Summarizer API',auth:'key',consumers:2,desc:'Keyword extraction and language detection (being retired).',ops:[['POST','/keywords','Extract keywords'],['POST','/language','Detect language']]},
 {name:'Zeta Risk Scoring API',backend:'https://zeta-risk.contoso.com/v2/score',suffix:'/risk/zeta/v1',codeRepo:SVC+'zeta-risk-scoring',vault:'kv-fin-prod/zeta-risk-key',team:'Risk Engineering',contact:'risk-eng@contoso.com',status:'active',auth:'oauth',consumers:6,desc:'Real-time fraud and credit risk scores from the Zeta scoring engine.',ops:[['POST','/score','Score a transaction','TEST123'],['POST','/score/batch','Score a batch of transactions','TEST124'],['GET','/models','List scoring models']]}
];
const LS_KEY='iaa-demo-v3';
const seedApis=()=>SEED.map((a,i)=>({id:'api-'+i,version:'v1',origin:'existing',...a,ops:a.ops.map(o=>[...o]),specFile:specPath({name:a.name,version:'v1'})}));
const fresh=()=>({v:3,apis:seedApis(),git:{repo:'https://github.com/contoso-ai/api-specs',branch:'main'},prs:[],nextPr:101,nextId:SEED.length,metrics:{searches:0,reuse:0,created:0,createdDespite:0,opsAdded:0},devDays:5});
function withTpls(s){
  const old=Array.isArray(s.templates)?s.templates:[],hid=new Set(old.filter(t=>t.builtIn&&t.enabled===false).map(t=>t.id));
  s.templates=BUILTIN_TPLS().map(t=>({...t,enabled:!hid.has(t.id)})).concat(old.filter(t=>!t.builtIn));
  if(!s.templates.some(t=>t.id===s.defaultTpl))s.defaultTpl='tpl-process';
  if(s.role!=='admin')s.role='user';
  if(!['fintech','aurora','midnight','horizon','sunset'].includes(s.skin))s.skin='fintech';
  if(!['auto','light','dark'].includes(s.mode))s.mode='auto';
  return s;
}
function load(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.v===3&&Array.isArray(s.apis)&&s.apis.length)return withTpls(s)}catch(e){}return withTpls(fresh())}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){}}
let store=load();
const initState=()=>({tab:'home',dmode:'match',flt:[{f:'OPERATION_ID',op:'=',v:''},{f:'BACKEND',op:'=',v:''}],fjoin:'AND',fres:null,query:'',results:[],searched:false,strong:false,reuseCounted:false,aiRequirement:'',aiResults:[],aiAnalysis:null,aiBusy:false,docSel:0,docQ:'',draft:null,cv:null,created:false,ops:[['GET','/health','Service health']]});
let state=initState();
let RN=[['GET','/','']];

// ================= Match engine (rule-based) =================
const STOP=new Set(['api','apis','service','services','the','a','an','for','and','of','to','v1','v2','v3','endpoint','https','http','www','com','net','io','internal','contoso','ai']);
const tokens=s=>String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>1&&!STOP.has(t)).map(t=>t.length>4&&t.endsWith('s')?t.slice(0,-1):t);
const hit=(t,set)=>set.some(x=>x===t||(t.length>=4&&x.length>=4&&(x.startsWith(t)||t.startsWith(x))));
function kwScore(a,qt){
  if(!qt.length)return{score:0};
  const nt=tokens(a.name),tt=tokens(a.desc+' '+a.ops.map(o=>o[1]+' '+o[2]).join(' '));
  const nh=qt.filter(t=>hit(t,nt)),th=qt.filter(t=>hit(t,tt)),all=[...new Set([...nh,...th])];
  if(nh.length===qt.length)return{score:90,why:'API name match'};
  return{score:Math.round(nh.length/qt.length*55+th.length/qt.length*40),why:'Keyword overlap: '+all.join(', ')};
}
function matchApi(a,q){
  q=String(q||'').trim();if(!q)return null;
  if(q[0]==='/'&&normSfx(a.suffix)===normSfx(q))return{score:100,why:'Exact gateway URL suffix match'};
  if(looksUrl(q)){
    const u=parseUrl(q),b=parseUrl(a.backend);
    if(u&&b&&u.host===b.host){
      if(u.path===b.path)return{score:100,why:'Exact backend endpoint match'};
      if(!u.path||!b.path||u.path.startsWith(b.path+'/')||b.path.startsWith(u.path+'/'))return{score:80,why:'Same host, overlapping path'};
      return{score:50,why:'Same host, different path: may be a separate service'};
    }
    const kw=kwScore(a,tokens(u?u.host.split('.')[0]+' '+u.path:q));
    return kw.score?{score:Math.min(kw.score,45),why:'Related by keywords ('+kw.why.replace(/^.*?: /,'')+')'}:null;
  }
  const kw=kwScore(a,tokens(q));return kw.score?kw:null;
}
const tier=s=>s>=90?{k:'reuse',t:'Strong match',rec:'Reuse',cls:'ok',box:''}:s>=60?{k:'review',t:'Likely match',rec:'Review before creating',cls:'info',box:'rv'}:{k:'similar',t:'Possible overlap',rec:'Check with the owning team',cls:'wn',box:'warn'};

// ================= OpenAPI generation (valid OpenAPI 3.0.3) =================
const yq=s=>JSON.stringify(String(s??''));
// Operation IDs: a custom ID (4th element) wins; otherwise one is generated from method + path.
function opIds(a){
  const used=new Set(a.ops.filter(o=>o[3]).map(o=>o[3]));
  return a.ops.map(o=>{if(o[3])return o[3];const m=o[0].toLowerCase();let b=m+o[1].replace(/[{}]/g,'').split(/[^A-Za-z0-9]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join('');if(b===m)b+='Root';let id=b,n=2;while(used.has(id))id=b+(n++);used.add(id);return id});
}
const cleanOp=o=>{const r=[o[0],String(o[1]||'').trim(),String(o[2]||'').trim()||'Operation'],id=String(o[3]||'').trim();if(id)r.push(id);return r};
function opsErrors(ops){
  const E=[],k=new Set(),ids=new Set();
  ops.forEach(o=>{
    const e=pathErr(o[1]);if(e)E.push(`Operation ${o[0]} ${o[1]}: path ${e}.`);
    const x=o[0]+' '+o[1];if(k.has(x))E.push(x+' is listed twice.');k.add(x);
    if(o[3]){if(!/^[A-Za-z][A-Za-z0-9_.-]{0,79}$/.test(o[3]))E.push(`Operation ID “${o[3]}” must start with a letter and use only letters, numbers, _ . -`);else if(ids.has(o[3].toLowerCase()))E.push(`Operation ID ${o[3]} is used twice.`);ids.add(o[3].toLowerCase())}
  });
  return E;
}
function swagger(a){
  const oauth=a.auth==='oauth',paths={},ids=opIds(a);
  a.ops.forEach(([m,p,s],i)=>{(paths[p]=paths[p]||[]).push([m.toLowerCase(),s,ids[i]])});
  let y='openapi: 3.0.3\ninfo:\n'+
    `  title: ${yq(a.name)}\n  version: ${yq(String(a.version||'v1').replace(/^v/i,'')+'.0.0')}\n  description: ${yq(a.desc||'Generated by Integration API Accelerator')}\n`+
    `  contact:\n    name: ${yq(a.team||'Unassigned')}\n`+(a.contact?`    email: ${yq(a.contact)}\n`:'')+
    `servers:\n  - url: ${yq(a.suffix||'/')}\n    description: "API gateway URL suffix"\n`+
    `x-backend-endpoint: ${yq(a.backend)}\nx-lifecycle-status: ${yq(a.status||'active')}\n`+
    (a.vault?`x-key-vault-named-value: ${yq(a.vault)}\n`:'')+
    `security:\n  - ${oauth?'bearerAuth':'subscriptionKey'}: []\n`;
  const P=Object.entries(paths);
  y+=P.length?'paths:\n':'paths: {}\n';
  P.forEach(([p,list])=>{
    y+=`  ${yq(p)}:\n`;
    const ps=[...new Set([...p.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]))];
    if(ps.length){y+='    parameters:\n';ps.forEach(n=>{y+=`      - name: ${yq(n)}\n        in: path\n        required: true\n        schema:\n          type: string\n`})}
    list.forEach(([m,s,id])=>{
      y+=`    ${m}:\n      summary: ${yq(s)}\n      operationId: ${yq(id)}\n`;
      if(m==='post'||m==='put'||m==='patch')y+='      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n';
      y+='      responses:\n        "200":\n          description: Success\n          content:\n            application/json:\n              schema:\n                type: object\n'+
         '        "400":\n          $ref: "#/components/responses/Error"\n        "401":\n          $ref: "#/components/responses/Error"\n        "500":\n          $ref: "#/components/responses/Error"\n';
    });
  });
  y+='components:\n  securitySchemes:\n'+(oauth?'    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n':'    subscriptionKey:\n      type: apiKey\n      in: header\n      name: Ocp-Apim-Subscription-Key\n')+
     '  responses:\n    Error:\n      description: Error\n      content:\n        application/json:\n          schema:\n            $ref: "#/components/schemas/Error"\n'+
     '  schemas:\n    Error:\n      type: object\n      properties:\n        code:\n          type: string\n        message:\n          type: string\n';
  return y;
}
function pathErr(p){
  if(!p.startsWith('/'))return 'must start with “/”';
  if(/\s/.test(p))return 'cannot contain spaces';
  if(!/^\/[A-Za-z0-9\-._~{}\/]*$/.test(p))return 'has invalid characters';
  if(p.includes('//'))return 'has an empty segment (“//”)';
  if(/[{}]/.test(p.replace(/\{[A-Za-z_][A-Za-z0-9_]*\}/g,'')))return 'has an unmatched or empty {parameter}';
  return '';
}
const sfxErr=s=>!s?'':/^\/[a-z0-9][a-z0-9\-._~\/]*$/i.test(s)?'':'Use letters, numbers, - . _ ~ and /, starting with /.';
const sfxOwner=s=>{const n=normSfx(s);return n?store.apis.find(a=>normSfx(a.suffix)===n):null};

// ================= Navigation =================
const tabs=[['home','Home','⌂'],['discovery','API Discovery','⌕'],['creation','API Creation','+'],['docs','API Documentation','▤'],['arch','Architecture','◇'],['tpl','TDD Templates','⚙']];
function render(){
  $('#nav').innerHTML=tabs.filter(t=>t[0]!=='tpl'||isAdmin()).map(([k,l,ic])=>`<button class="${state.tab===k?'on':''}"${state.tab===k?' aria-current="page"':''} onclick="go('${k}')"><span class="ic" aria-hidden="true">${ic}</span>${l}</button>`).join('');
  applySkin();togglePanel(false);drawGit();drawRole();drawSkin();
  ({home:vHome,discovery:vDisc,creation:vCreate,docs:vDocs,arch:vArch,tpl:vTpl})[state.tab]();
  window.scrollTo(0,0);
}
function go(t){
  if(state.tab==='creation'&&t!=='creation'&&$('#n')&&!state.created)state.draft={...formApi(),jus:g('jus'),versionOf:state.cv};
  state.tab=t;render();
}
function showDoc(i){if(i<0)return;state.docSel=i;go('docs')}
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>{t.className=''},2600)}

// ================= Home =================
const QUICK=[['ml.internal.contoso.com/inference','https://ml.internal.contoso.com/inference'],['nlp.contoso.com/sentiment','https://nlp.contoso.com/sentiment'],['new-service.contoso.com','https://new-service.contoso.com/api']];
function quick(i){state.dmode='match';state.query=QUICK[i][1];go('discovery');search()}
const met=(v,l,cls='',id='')=>`<div class="met ${cls}"><b${id?` id="${id}"`:''}>${esc(v)}</b><span>${l}</span></div>`;
function setDD(v){const n=Math.max(0,Math.min(500,parseFloat(v)||0));store.devDays=n;save();const el=$('#saved');if(el)el.textContent=Math.round(store.metrics.reuse*n*10)/10}
function vHome(){
  const m=store.metrics,A=store.apis,ops=A.reduce((n,a)=>n+a.ops.length,0),dec=m.reuse+m.created;
  $('#app').innerHTML=`
  <div class="hd"><div><h1>Integration API Accelerator &amp; Reuse Advisor</h1><p class="sub">Check whether an API already exists for your backend before building a new one. Reuse first, create only when needed.</p></div>
  <button class="btn" onclick="startTour()">▶ Guided demo</button></div>
  <div class="quote"><div class="q-t">“Discover first. Reuse always. Build only what’s missing.”</div><div class="q-s">The reuse-first principle behind every API in this platform: one backend, one API, no duplicates.</div></div>
  <section class="card ai-card" aria-labelledby="ai-home-title">
    <div class="ai-head"><span class="ai-orb">✦</span><div><h2 id="ai-home-title" style="margin:0">IntegraIQ AI Assistant</h2><span class="mu small">Describe the business requirement. Find reusable APIs before designing a new one.</span></div><span class="ai-chip">AI-assisted workflow</span></div>
    <label for="homeAiReq">What are you trying to integrate?</label>
    <textarea id="homeAiReq" rows="3" placeholder="Example: I need to generate vector embeddings for product descriptions and search similar content.">${esc(state.aiRequirement||'')}</textarea>
    <div class="ai-actions"><button class="btn" onclick="startAIFromHome()">✦ Find reusable APIs</button><button class="btn ghost sm" onclick="setHomeExample()">Use sample requirement</button></div>
    <p class="ai-note">Prototype mode: local matching is used until an approved AI backend is configured. No API keys are stored in this HTML file.</p>
  </section>
  <section class="card" aria-labelledby="mh">
    <div class="wf-h2"><h2 id="mh">Impact</h2><span class="mu small">Counters from usage in this browser</span></div>
    ${repoHero()}
    <div class="met-g">
      ${met(new Set(A.map(a=>(parseUrl(a.backend)||{}).host)).size,'Distinct backend hosts')}${met(ops,'Operations catalogued')}${met(m.searches,'Reuse checks run')}${met(dec?Math.round(m.reuse/dec*100)+'%':'–','Reuse rate (reused ÷ decisions)')}
      ${met(m.reuse,'Duplicate APIs avoided')}${met(Math.round(m.reuse*store.devDays*10)/10,'Est. dev-days saved','hl','saved')}${met(m.created,`New APIs created${m.createdDespite?` (${m.createdDespite} with justification)`:''}`)}${met(store.prs.length,'Specs awaiting review')}
    </div>

window.INTEGRAIQ_AI_ENDPOINT = window.INTEGRAIQ_AI_ENDPOINT || (window.location.protocol.startsWith('http') ? '/api/ai' : '');
function setHomeExample(){const q='Generate vector embeddings for text and documents so that similar content can be found.';const el=$('#homeAiReq');if(el)el.value=q;state.aiRequirement=q}
function fillAIExample(q){const el=$('#aiReq');if(el)el.value=q;state.aiRequirement=q}
function startAIFromHome(){const q=($('#homeAiReq')||{}).value||'';state.aiRequirement=q;state.tab='discovery';state.dmode='match';render();runAIRequirement()}
function aiTokens(s){return [...new Set(tokens(String(s||'').replace(/\b(retrieve|fetch|find|get)\b/gi,'read').replace(/\b(generate|create|build)\b/gi,'make')))];}
const AI_SYNONYMS={embedding:['vector','embed','similarity','semantic','vectorize'],search:['query','find','similarity','lookup','retrieve'],summarize:['summary','condense','shorten','document'],document:['file','content','text','report'],model:['prediction','inference','llm','chat'],prompt:['template','instruction','completion'],risk:['fraud','credit','score'],customer:['client','consumer','account'],address:['location','shipping','postal']};
function aiExpandedTokens(q){const base=aiTokens(q),out=new Set(base);base.forEach(t=>Object.entries(AI_SYNONYMS).forEach(([k,vs])=>{if(t===k||vs.includes(t)){out.add(k);vs.forEach(v=>out.add(v))}}));return [...out]}
function localAIScore(a,q){
  const qBase=aiTokens(q),qAll=aiExpandedTokens(q),doc=aiTokens([a.name,a.desc,a.suffix,a.ops.map(o=>o.join(' ')).join(' ')].join(' '));
  if(!qBase.length)return{score:0,matched:[],gaps:[]};
  const matched=qAll.filter(t=>doc.includes(t)),direct=qBase.filter(t=>doc.includes(t));
  const coverage=direct.length/Math.max(1,qBase.length),semantic=matched.length/Math.max(1,qAll.length);
  let score=Math.round(Math.min(96,coverage*72+semantic*34));
  // Give operation summaries and API descriptions more weight than incidental URL tokens.
  const descTokens=aiTokens(a.desc+' '+a.ops.map(o=>o[2]).join(' '));
  const descHits=qAll.filter(t=>descTokens.includes(t)).length;
  score=Math.min(98,score+Math.min(12,descHits*2));
  const gaps=qBase.filter(t=>!doc.includes(t)&&!qAll.some(x=>doc.includes(x)&&AI_SYNONYMS[x]?.includes(t)));
  return{score,matched:[...new Set(matched)].slice(0,8),gaps:gaps.slice(0,5)};
}
function aiExplain(a,r){
  const ops=a.ops.filter(o=>{const z=aiTokens(o[1]+' '+o[2]);return r.matched.some(t=>z.includes(t))});
  return{ops:ops.slice(0,3),why:r.matched.length?`Related concepts found: ${r.matched.join(', ')}.`:'Some general relevance was found in the API description.',gaps:r.gaps};
}
async function runAIRequirement(){
  const el=$('#aiReq');if(el)state.aiRequirement=el.value;

  const host=$('#aiResults');if(!host)return;
  state.aiBusy=true;host.innerHTML='<div class="ai-loading"><span class="spin" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>Understanding requirement and searching the API catalog…</div>';
  // Optional production adapter: set window.INTEGRAIQ_AI_ENDPOINT in deployment config and expose POST /analyze.
  try{
    if(window.INTEGRAIQ_AI_ENDPOINT){
      const response=await fetch(window.INTEGRAIQ_AI_ENDPOINT.replace(/\/$/,'')+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requirement:q,catalog:store.apis.map(a=>({id:a.id,name:a.name,description:a.desc,backend:a.backend,suffix:a.suffix,team:a.team,status:a.status,operations:a.ops.map(o=>({method:o[0],path:o[1],summary:o[2]}))}))})});
      if(!response.ok)throw new Error('AI service returned HTTP '+response.status);
      const data=await response.json();state.aiAnalysis=data;state.aiResults=(data.matches||[]).map(m=>({i:store.apis.findIndex(a=>a.id===m.id),score:m.score||0,matched:m.matched_terms||[],gaps:m.gaps||[],why:m.reason||'AI relevance match'})).filter(x=>x.i>=0);drawAIResults();return;
    }
  }catch(e){host.innerHTML=`<div class="ai-warn">AI service unavailable: ${esc(e.message)}. Showing local demo recommendations instead.</div>`}
  const scored=store.apis.map((a,i)=>({i,...localAIScore(a,q)})).filter(x=>x.score>=12).sort((a,b)=>b.score-a.score).slice(0,5);
  state.aiResults=scored;state.aiAnalysis={mode:'local-demo',requirement:q,entities:aiTokens(q).slice(0,8)};drawAIResults();
}
function drawAIResults(){
  const host=$('#aiResults');if(!host)return;const q=state.aiRequirement,results=state.aiResults||[];

  const summary=state.aiAnalysis?.summary|| (recommendation==='REUSE'?'An existing API appears to cover important parts of this requirement. Validate operation-level coverage with the owning team.':recommendation==='REVIEW'?'Some related capabilities exist. Check missing operations and ownership before deciding.':'No sufficiently relevant API was found in this sample catalog. A new API design may be appropriate after confirming the search scope.');

    <div class="ai-result"><b>Next recommended action</b><p class="mu small">${recommendation==='REUSE'?'Review the top candidate and confirm its operation and data coverage.':recommendation==='REVIEW'?'Ask the owning team whether the existing API can be extended without breaking consumers.':'Draft a new API proposal, then complete backend, owning team and security details.'}</p><div class="ai-actions"><button class="btn" onclick="draftApiFromAI()">✦ Draft API design from requirement</button><button class="btn ghost sm" onclick="copyAIAnalysis()">Copy analysis</button></div></div>

      <li>Gateway URL suffixes are unique across the catalog.</li>
      <li>Deprecated APIs are flagged in discovery and point to their successor.</li>
      <li>Secrets never pass through the tool; only Key Vault named-value names are stored.</li>
      <li>Only admins (the API governance group) can add, change or hide TDD templates; end users choose from the published list.</li></ul></div>
    <div class="card"><h2>Repository model</h2><ul class="lst">
      <li>One spec repository for every API: <code>apis/&lt;api-name&gt;/&lt;version&gt;/openapi.yaml</code>.</li>
      <li>Service code stays in each team’s own repository, linked as “Service code repo”.</li>
      <li>One place to review, lint and audit every API contract.</li>
      <li>New versions sit beside old ones, so consumers can migrate before the old version is retired.</li></ul></div>
  </div>
  <div class="card"><h2>Roadmap</h2><ul class="lst">
    <li><b>Semantic matching:</b> use the Embeddings API to find overlaps that share no keywords.</li>
    <li><b>Import operations</b> from a backend’s existing OpenAPI document instead of typing them.</li>
    <li><b>AI assistance:</b> suggested operation summaries and likely missing operations.</li>
    <li><b>Consumer onboarding:</b> request a subscription from the documentation page.</li>
    <li><b>Gateway analytics</b> replace browser counters with real usage data.</li></ul></div>`;
}

const FF={
  API_NAME:['API name',a=>[a.name]],
  OPERATION_ID:['Operation ID',(a,ids)=>ids,1],
  NAMED_VALUE:['Named value (Key Vault)',a=>[a.vault||'']],
  BACKEND:['Backend endpoint',a=>[a.backend]],
  URL_SUFFIX:['Gateway URL suffix',a=>[a.suffix]],
  PATH:['Operation path',a=>a.ops.map(o=>o[1]),1],
  METHOD:['Operation method',a=>a.ops.map(o=>o[0]),1],
  TEAM:['Owning team',a=>[a.team]],
  STATUS:['Lifecycle status',a=>[a.status]],
  VERSION:['Version',a=>[a.version]]
};
const FA={NAME:'API_NAME',APINAME:'API_NAME',OPERATIONID:'OPERATION_ID',OPID:'OPERATION_ID',NAMEDVALUE:'NAMED_VALUE',KEY_VAULT:'NAMED_VALUE',KEYVAULT:'NAMED_VALUE',SUFFIX:'URL_SUFFIX',LIFECYCLE:'STATUS',BACKEND_URL:'BACKEND'};
const FPH={OPERATION_ID:'TEST123',API_NAME:'%Search%',NAMED_VALUE:'kv-ai-prod/%',BACKEND:'%ZETA%',URL_SUFFIX:'/ai/%',PATH:'/models%',METHOD:'POST',TEAM:'%NLP%',STATUS:'active',VERSION:'v1'};
const FEX=["OPERATION_ID = 'TEST123'","BACKEND = '%ZETA%'","NAMED_VALUE = 'kv-ai-prod/%'","API_NAME = '%Search%' OR API_NAME = '%Embed%'","OPERATION_ID = 'TEST123' AND BACKEND = '%ZETA%'"];
function like(val,pat){
  const re=new RegExp('^'+String(pat).split('%').map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$','i');
  return re.test(String(val||''));
}
const qExpr=()=>state.flt.filter(c=>c.v.trim()).map(c=>`${c.f} ${c.op} '${c.v.trim().replace(/'/g,"''")}'`).join(` ${state.fjoin} `);
function parseQ(s){
  s=String(s||'').trim();if(!s)return{conds:[],join:'AND'};
  const re=/\s*([A-Za-z_]+(?: [A-Za-z_]+)?)\s*(!=|<>|=|NOT\s+LIKE|LIKE)\s*'((?:[^']|'')*)'\s*(?:(AND|OR)\b|$)/iy;
  const conds=[],joins=new Set();let pos=0;
  while(pos<s.length){
    re.lastIndex=pos;const m=re.exec(s);
    if(!m)return{err:`Couldn’t read the query near “${s.slice(pos,pos+30)}”. Write conditions as FIELD = 'value', joined with AND or OR.`};
    let f=m[1].toUpperCase().replace(/\s+/g,'_');f=FA[f]||f;
    if(!FF[f])return{err:`Unknown field ${m[1]}. Use one of: ${Object.keys(FF).join(', ')}.`};
    const o=m[2].toUpperCase().replace(/\s+/g,' ');
    conds.push({f,op:(o==='!='||o==='<>'||o==='NOT LIKE')?'!=':'=',v:m[3].replace(/''/g,"'")});
    if(m[4])joins.add(m[4].toUpperCase());
    pos=re.lastIndex;
    if(m[4]&&pos>=s.length)return{err:`The query ends with ${m[4].toUpperCase()}. Add another condition after it.`};
  }
  if(joins.size>1)return{err:'Use either AND or OR between conditions, not both.'};
  return{conds,join:[...joins][0]||'AND'};
}
function fltHTML(){
  return `<div class="card searchbox">

    <div class="fb-h"><b>Filter builder</b><span>Match <select id="fj" aria-label="Combine conditions" onchange="state.fjoin=this.value;syncQ()"><option value="AND">all conditions (AND)</option><option value="OR">any condition (OR)</option></select></span></div>

function drawFlt(){

    <select aria-label="Field" onchange="state.flt[${i}].f=this.value;drawFlt();syncQ()">${Object.entries(FF).map(([k,v])=>`<option value="${k}"${k===c.f?' selected':''}>${v[0]}</option>`).join('')}</select>

}
function syncQ(){const q=$('#fq');if(q)q.value=qExpr();const e=$('#fqerr');if(e)e.textContent=''}
function addF(){state.flt.push({f:'API_NAME',op:'=',v:''});drawFlt()}
function clearF(){state.flt=[{f:'API_NAME',op:'=',v:''}];state.fres=null;drawFlt();syncQ();const r=$('#fres');if(r)r.innerHTML=''}
function setQ(s){const q=$('#fq');if(q)q.value=s;applyQuery()}
function applyQuery(){
  const r=parseQ(($('#fq')||{}).value);

  $('#fqerr').textContent='';
  if(!r.conds.length){clearF();return}

}
function runFilter(){
  const C=state.flt.filter(c=>c.v.trim()),fr=$('#fres');
  if(!C.length){state.fres=null;if(fr)fr.innerHTML='<div class="card"><p class="mu" style="margin:0">Add at least one condition with a value.</p></div>';return}
  const and=state.fjoin!=='OR',rows=[];
  store.apis.forEach((a,i)=>{

    C.forEach(c=>{
      const m=[];FF[c.f][1](a,ids).forEach((x,k)=>{if(like(x,c.v.trim()))m.push(k)});
      const pass=c.op==='='?m.length>0:m.length===0;
      if(pass&&c.op==='='&&FF[c.f][2])m.forEach(k=>hits.add(k));
      ok=and?(ok&&pass):(ok||pass);
    });
    if(ok)rows.push({i,hits:[...hits].sort((x,y)=>x-y)});
  });
  state.fres={q:qExpr(),rows};drawFres();
}

function tddBlocks(a,tpl){

const TBD_RE=/\[TBD[^\]]*\]/g;
const TDD_CSS='body,h1,h2,h3,h4,h5,p,li{font-family:Calibri,Arial,sans-serif}body{font-size:11pt;color:#1a1a1a;margin:28px;line-height:1.4}h1{font-size:20pt;color:#0b1f3a;margin:0 0 8px}h2{font-size:14pt;color:#0b6e4c;border-bottom:1px solid #c9d6d1;padding-bottom:3px;margin:22px 0 8px}h3{font-size:12.5pt;color:#0b1f3a;margin:16px 0 6px}h4{font-size:11.5pt;color:#0b1f3a;margin:12px 0 6px}h5{font-size:11pt;color:#333;margin:10px 0 4px}table{border-collapse:collapse;width:100%;margin:6px 0 10px}th,td{border:1px solid #bfbfbf;padding:5px 8px;text-align:left;vertical-align:top;font-size:10pt}th{background:#e6f1ec}pre{font-family:Consolas,monospace;font-size:9pt;background:#f4f6f8;border:1px solid #d9d9d9;padding:8px;white-space:pre-wrap}.toc{margin:1px 0;font-size:10.5pt}.tbd{background:#fff2a8;color:#7a5200}';
function tddHtml(a,tpl){
  const e=s=>esc(s).replace(TBD_RE,x=>`<span class="tbd">${x}</span>`),ec=s=>e(s).replace(/\n/g,'<br>');
  let body='',title='';
  tddBlocks(a,tpl).forEach(b=>{
    if(b.title!=null){title=b.title;body+=`<h1>${e(b.title)}</h1>`}
    else if(b.h)body+=`<h${b.h}>${e(b.t)}</h${b.h}>`;
    else if(b.p)body+=`<p>${e(b.p)}</p>`;
    else if(b.ul)body+='<ul>'+b.ul.map(x=>`<li>${e(x)}</li>`).join('')+'</ul>';
    else if(b.toc)body+=b.items.map(x=>`<p class="toc" style="margin:0 0 0 ${Math.max(0,x.l-2)*20}px">${e(x.t)}</p>`).join('');
    else if(b.pre)body+=`<pre>${esc(b.pre)}</pre>`;
    else if(b.tb){const cs='border:1px solid #bfbfbf;padding:5px 8px;text-align:left;vertical-align:top;font-size:10pt;font-family:Calibri,Arial,sans-serif',cell=x=>String(x).trim()?ec(x):'&nbsp;';

function tddMd(a,tpl){

      <div class="addb"><span class="mu small">Add:</span>${Object.entries(BT).map(([k,v])=>`<button class="btn ghost sm" onclick="addB('${k}')">+ ${v}</button>`).join('')}</div>
    </div>
    <div class="card"><div class="row"><button class="btn" onclick="saveTpl()">Save template</button><button class="btn ghost" onclick="cancelTpl()">Cancel</button></div><div id="tplerr" class="err" role="alert"></div></div>
  </div><div class="cg-r">
    <div class="card"><div class="wf-h2"><h2>Live preview</h2><select id="tpa" aria-label="Preview with API" style="width:auto" onchange="tplPrevSoon(0)">${store.apis.map((a,k)=>`<option value="${k}">${esc(a.name)} ${esc(a.version)}</option>`).join('')}</select></div>
      <iframe id="tplif" class="tdd-prev" style="height:50vh;margin-top:0" sandbox="" title="Template preview"></iframe></div>
    <div class="card"><h2>Placeholders</h2><p class="mu small" style="margin-top:-6px">Use in any heading, text, list item or table cell. Empty values become <span class="tbd-k">[TBD]</span>.</p>
      <div class="phl">${Object.entries(PH).map(([k,v])=>`<div><code>{{${k}}}</code><span class="mu">${v}</span></div>`).join('')}</div>
      <p class="mu small" style="margin:0">Tables: one row per line, cells separated by <code>|</code>, first line is the header. Write <code>\\n</code> for a line break inside a cell.</p></div>
  </div></div>`;
  drawBlks();tplPrevSoon(0);
}
function drawBlks(){
  const el=$('#blks');if(!el)return;const B=state.tplEdit.t.blocks;
  $('#bcount').textContent=`${B.length} blocks`;
  el.innerHTML=B.map((b,i)=>`<div class="blk blk-${b.t}"><div class="blk-h"><span class="blk-t">${BT[b.t]}</span>
    ${b.t==='h'?`<select aria-label="Heading level" onchange="tb_(${i},'l',+this.value)">${[1,2,3,4,5].map(l=>`<option value="${l}"${(b.l||2)===l?' selected':''}>H${l}</option>`).join('')}</select>`:''}
    ${b.t==='auto'?`<select aria-label="Auto section" onchange="tb_(${i},'k',this.value);drawBlks()">${Object.entries(AUTO).map(([k,v])=>`<option value="${k}"${b.k===k?' selected':''}>${v[0]}</option>`).join('')}</select>`:''}
    <span class="blk-sp"></span>
    <button class="ib" aria-label="Move up" onclick="mvB(${i},-1)"${i?'':' disabled'}>↑</button><button class="ib" aria-label="Move down" onclick="mvB(${i},1)"${i<B.length-1?'':' disabled'}>↓</button><button class="ib" aria-label="Remove block" onclick="rmB(${i})">✕</button></div>
    ${b.t==='h'?`<input aria-label="Heading text" value="${esc(b.x)}" oninput="tb_(${i},'x',this.value)">`
     :b.t==='auto'?`<p class="mu small" style="margin:0">${esc((AUTO[b.k]||['',''])[1])}. Filled from the API when the TDD is generated.</p>`
     :`<textarea aria-label="${BT[b.t]} content" rows="${b.t==='p'?2:Math.min(8,Math.max(2,String(b.x||'').split('\n').length+1))}" placeholder="${b.t==='tbl'?'Header 1 | Header 2&#10;Cell | Cell':b.t==='ul'?'One item per line':'Text with {{placeholders}}'}" oninput="tb_(${i},'x',this.value)">${esc(b.x||'')}</textarea>`}
  </div>`).join('')||'<p class="mu small">No sections yet. Add one below.</p>';
}
function tb_(i,k,v){state.tplEdit.t.blocks[i][k]=v;tplPrevSoon()}
function mvB(i,d){const B=state.tplEdit.t.blocks,j=i+d;if(j<0||j>=B.length)return;[B[i],B[j]]=[B[j],B[i]];drawBlks();tplPrevSoon()}
function rmB(i){state.tplEdit.t.blocks.splice(i,1);drawBlks();tplPrevSoon()}
function addB(k){
  state.tplEdit.t.blocks.push(k==='h'?bH(2,'New section'):k==='p'?bP(''):k==='ul'?bU(''):k==='tbl'?bT('Column 1 | Column 2\n | '):bA('ops'));
  drawBlks();tplPrevSoon();const bs=document.querySelectorAll('.blk');if(bs.length)bs[bs.length-1].scrollIntoView({behavior:'smooth',block:'nearest'});
}
let tplT;
function tplPrevSoon(ms=300){clearTimeout(tplT);tplT=setTimeout(()=>{const f=$('#tplif');if(!f||!state.tplEdit)return;const a=store.apis[+(($('#tpa')||{}).value||0)]||store.apis[0];f.srcdoc=tddHtml(a,state.tplEdit.t)},ms)}
function saveTpl(){
  const e=state.tplEdit,t=e.t,err=$('#tplerr');t.name=String(t.name||'').trim();
  if(!t.name){err.textContent='Template name is required.';return}
  if(!t.blocks.length){err.textContent='Add at least one section.';return}
  if(store.templates.some((x,j)=>j!==e.idx&&x.name.toLowerCase()===t.name.toLowerCase())){err.textContent='Another template already has this name.';return}
  if(e.idx!=null)store.templates[e.idx]=t;
  else{t.id='tpl-'+Date.now().toString(36);t.builtIn=false;t.enabled=true;store.templates.push(t)}
  save();state.tplEdit=null;vTpl();toast('Template saved and available to users');
}
function cancelTpl(){state.tplEdit=null;vTpl()}

// ---------- template import ----------
function tplFromJson(o){
  const t=o&&o.template?o.template:o;
  if(!t||typeof t.name!=='string'||!Array.isArray(t.blocks))throw new Error('Not a TDD template file.');
  const blocks=t.blocks.filter(b=>b&&BT[b.t]).map(b=>b.t==='auto'?bA(AUTO[b.k]?b.k:'ops',b.l?Math.max(1,Math.min(5,+b.l)):undefined):b.t==='h'?bH(Math.max(1,Math.min(5,+b.l||2)),String(b.x||'')):{t:b.t,x:String(b.x||'')});
  if(!blocks.length)throw new Error('The template has no sections.');
  return{name:String(t.name).slice(0,80),desc:String(t.desc||''),title:String(t.title||'{{api.title}}'),blocks};
}
function decodeQP(s){
  s=s.replace(/=\r?\n/g,'');const out=[],enc=new TextEncoder();
  for(let i=0;i<s.length;i++){const c=s[i];
    if(c==='='&&/^[0-9A-Fa-f]{2}$/.test(s.substr(i+1,2))){out.push(parseInt(s.substr(i+1,2),16));i+=2}
    else{const code=s.charCodeAt(i);if(code<128)out.push(code);else out.push(...enc.encode(c))}}
  return new TextDecoder('utf-8').decode(new Uint8Array(out));
}
function extractHtml(raw){
  const head=raw.slice(0,4000),bm=head.match(/boundary="?([^"\r\n;]+)"?/i);
  if(bm&&/^(MIME-Version|Content-Type|Date|From|Subject|Message-ID):/im.test(head)){
    for(const part of raw.split('--'+bm[1])){
      const sp=part.search(/\r?\n\r?\n/);if(sp<0)continue;
      const hd=part.slice(0,sp),body=part.slice(sp).replace(/^\r?\n\r?\n/,'');
      if(!/content-type:\s*text\/html/i.test(hd))continue;
      if(/transfer-encoding:\s*quoted-printable/i.test(hd))return decodeQP(body);
      if(/transfer-encoding:\s*base64/i.test(hd)){const b=atob(body.replace(/\s+/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}
      return body;
    }
  }
  return raw;
}
function htmlToBlocks(html){
  if(!/<(html|body|h[1-6]|table|p)[\s>]/i.test(html))throw new Error('This looks like a binary Word file. In Word, use Save As → Web Page (.htm) and import that.');
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,head,img,svg,object,iframe').forEach(x=>x.remove());
  const B=[],txt=n=>n.textContent.replace(/\s+/g,' ').trim();let title='',afterToc=false;
  const cellTxt=c=>{const li=[...c.querySelectorAll('li')];if(li.length)return li.map(txt).filter(Boolean).join('\\n');const ps=[...c.querySelectorAll('p')].map(txt).filter(Boolean);return ps.length>1?ps.join('\\n'):txt(c)};
  const walk=n=>{for(const c of [...n.childNodes]){
    if(c.nodeType===3){const t=c.textContent.replace(/\s+/g,' ').trim();if(t){B.push(bP(t));afterToc=false}continue}
    if(c.nodeType!==1)continue;const tag=c.tagName.toLowerCase();
    if(/^h[1-6]$/.test(tag)){const t=txt(c);if(!t)continue;const l=+tag[1];if(l===1&&!title){title=t;continue}B.push(bH(Math.max(2,Math.min(5,l)),t));afterToc=/^table of contents$|^contents$/i.test(t);continue}
    if(tag==='table'){
      const own=[...c.querySelectorAll('td,th')].filter(x=>x.closest('table')===c);
      if(own.some(x=>x.querySelector('table'))){own.forEach(walk);continue}
      let trs=[...c.querySelectorAll('tr')].filter(tr=>tr.closest('table')===c);
      // A first row holding only a heading is the table's title (Confluence style)
      if(trs.length&&trs[0].querySelector('h1,h2,h3,h4,h5,h6')&&[...trs[0].children].filter(x=>txt(x)).length===1){walk(trs[0]);trs=trs.slice(1)}
      const rows=trs.map(tr=>[...tr.children].filter(x=>/^t[dh]$/i.test(x.tagName)).map(x=>cellTxt(x).replace(/\|/g,'/')));
      const w=Math.max(0,...rows.map(r=>r.length));
      if(w&&rows.length)B.push(bT(rows.map(r=>{while(r.length<w)r.push('');return r.join(' | ')}).join('\n')));
      afterToc=false;continue}
    if(tag==='ul'||tag==='ol'){
      if(afterToc){B.push(bA('toc'));afterToc=false;continue}
      const items=[...c.children].filter(x=>x.tagName==='LI').map(txt).filter(Boolean);if(items.length)B.push(bU(items.join('\n')));continue}
    if(tag==='p'||tag==='pre'){const t=txt(c);if(t){B.push(bP(t));afterToc=false}continue}
    walk(c)}};
  walk(doc.body||doc.documentElement);
  // Swap recognised sections for auto sections
  const RULES=[[/request\s*(and|&)\s*response/i,'reqres'],[/message volume/i,'volume'],[/data flow|process flow/i,'flow']];
  B.forEach((b,i)=>{if(b.t!=='h')return;const r=RULES.find(x=>x[0].test(b.x));if(!r)return;
    for(let j=i+1;j<B.length&&j<=i+3&&B[j].t!=='h';j++){if(B[j].t==='tbl'){B[j]=bA(r[1]);break}}});
  return{title,blocks:B};
}
function importTplFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  if(/\.docx$/i.test(f.name)){toast('.docx isn’t supported: save it as Web Page (.htm) and import that');return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const raw=String(r.result);let t;
      if(/\.json$/i.test(f.name))t=tplFromJson(JSON.parse(raw));
      else{const res=htmlToBlocks(extractHtml(raw));if(!res.blocks.length)throw new Error('No headings, text or tables were found.');
        t={name:(res.title||f.name.replace(/\.[^.]+$/,'')).slice(0,80)+' (imported)',desc:`Imported from ${f.name}`,title:'{{api.title}}',blocks:res.blocks}}
      state.tplEdit={idx:null,src:f.name,t};vTpl();toast(`Imported ${t.blocks.length} sections. Review, then save.`);
    }catch(e){toast('Import failed: '+e.message)}
  };
  r.onerror=()=>toast('Couldn’t read the file');
  r.readAsText(f);
}

function drawGit(){
  const P=store.prs.slice(0,5),repo=safeUrl(store.git.repo);
  $('#gitbox').innerHTML=`<div class="g-t"><span>⎇ Spec repository</span><i class="g-ok">simulated</i></div>
  <label class="sr" for="gr">Spec repository URL</label><input id="gr" value="${esc(store.git.repo)}" onchange="setGit('repo',this)">
  <label class="sr" for="gb">Base branch</label><input id="gb" value="${esc(store.git.branch)}" onchange="setGit('branch',this)">
  <div class="g-err" id="gerr"></div>
  ${repo?`<a class="g-open" href="${esc(repo)}" target="_blank" rel="noopener noreferrer">Open repo ↗</a>`:''}
  <div class="g-t" style="margin-top:14px"><span>Pull requests</span></div>
  ${P.length?P.map(p=>`<button class="g-f" onclick="showDoc(${idxById(p.apiId)})"><span>#${p.n} ${esc(p.title)}</span><code>open</code></button>`).join(''):'<div class="g-e">APIs you create or extend are proposed here as pull requests.</div>'}`;
}
function setGit(k,el){
  const v=el.value.trim();
  if(k==='repo'&&!safeUrl(v)){$('#gerr').textContent='Use an https:// URL.';el.value=store.git.repo;return}
  if(!v){el.value=store.git[k];return}
  store.git[k]=v;save();drawGit();
  const f=document.getElementById(k==='repo'?'r':'br');if(f){f.value=v;livePrev()}
}
function resetDemo(b){
  if(b.dataset.c){const sk=store.skin,mo=store.mode;store=withTpls(fresh());store.skin=sk;store.mode=mo;save();state=initState();b.dataset.c='';b.textContent='↺ Reset demo data';endTour();render();toast('Demo data reset')}
  else{b.dataset.c='1';b.textContent='Click again to confirm';setTimeout(()=>{b.dataset.c='';b.textContent='↺ Reset demo data'},3000)}
}

// ================= Guided demo =================
let tour=null;
const TOUR=[
  {t:'Reuse-first in about a minute. This tour drives the real screens with sample data. Use Next to move on.',run:()=>go('home')},
  {t:'A team needs the inference backend. Before building anything, they check the catalog.',run:()=>{state.dmode='match';state.query='https://ml.internal.contoso.com/inference';go('discovery');search()}},
  {t:'Exact backend match (100%). Instead of building a new API, they add the one operation that’s missing.',run:()=>{finishScan();const i=idxByName('Model Inference API'),a=store.apis[i];const p=a.ops.some(o=>o[1]==='/predict/batch')?'/predict/async':'/predict/batch';openReuse(i,[['POST',p,'Batch predictions']])}},
  {t:'A pull request is opened on the spec repo for the owning team to review. Nothing goes straight to main.',run:()=>commitOps(idxByName('Model Inference API'))},
  {t:"Advanced filter: search on several fields at once, such as OPERATION_ID = 'TEST123' OR BACKEND = '%ZETA%'.",run:()=>{state.dmode='filter';go('discovery');setQ("OPERATION_ID = 'TEST123' OR BACKEND = '%ZETA%'")}},
  {t:'A different service on a shared host scores 50%, a possible overlap, instead of a false 100% match.',run:()=>{state.dmode='match';state.query='https://nlp.contoso.com/sentiment';go('discovery');search()}},
  {t:'Docs show owner, lifecycle, auth and a valid OpenAPI spec. Users pick a TDD template and download a pre-filled Word document.',run:()=>showDoc(idxByName('Model Inference API'))},
  {t:'Admins manage TDD templates: import a Word or Confluence page, edit sections and placeholders, and choose the default.',run:()=>{if(state.tourRole==null)state.tourRole=store.role;store.role='admin';state.tplEdit=null;go('tpl')}},
  {t:'Architecture maps each simulated step to production systems and governance.',run:()=>{if(state.tourRole!=null){store.role=state.tourRole;state.tourRole=null}go('arch')}},
  {t:'Metrics update as teams reuse instead of rebuilding. That’s the tour.',run:()=>go('home')}
];
function drawTour(){
  const el=$('#tour');document.body.classList.toggle('touring',tour!==null);
  if(tour===null){el.hidden=true;return}
  el.hidden=false;const last=tour===TOUR.length-1;
  el.innerHTML=`<div class="t-n">Guided demo · ${tour+1} / ${TOUR.length}</div><p>${esc(TOUR[tour].t)}</p><div class="t-b"><button class="btn ghost sm" onclick="endTour()">Exit</button><button class="btn sm" onclick="nextTour()">${last?'Finish':'Next →'}</button></div>`;
}
function startTour(){tour=0;TOUR[0].run();drawTour()}
function nextTour(){if(tour===null)return;if(tour>=TOUR.length-1)return endTour();tour++;TOUR[tour].run();drawTour()}
function endTour(){tour=null;drawTour();if(state.tourRole!=null){store.role=state.tourRole;state.tourRole=null;render()}}

render();
